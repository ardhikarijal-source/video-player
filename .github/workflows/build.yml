name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag yang akan dibuatkan GitHub Release (contoh: v1.2). Kosongkan jika hanya ingin build."
        required: false
        type: string
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Siapkan kunci tanda tangan
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pemutar.jks"

      - name: Build APK debug
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/pemutar.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: pemutar
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PemutarVideo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Buat GitHub Release dan lampirkan APK
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: Pemutar Video ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
