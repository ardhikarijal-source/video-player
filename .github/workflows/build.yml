name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Nama GitHub Release yang akan dibuat (contoh: v1.2). Kosongkan jika hanya ingin build."
        required: false
        type: string
  push:
    branches: [ main, master, release/v1.3 ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Gunakan commit pemicu workflow. Untuk manual run, build dari commit main
      # yang dipilih; tag release boleh dibuat pada tahap publikasi di bawah.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Siapkan kunci tanda tangan (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pemutar.jks"
          else
            echo "KEYSTORE_BASE64 belum diatur; build memakai debug signing bawaan Android."
          fi

      - name: Build APK debug
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/pemutar.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: pemutar
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PemutarVideo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Buat GitHub Release dan lampirkan APK
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Pemutar Video ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
